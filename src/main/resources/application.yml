server:
  port: 8080
  servlet: 
    context-path: /api
  error:
    include-stacktrace: never

spring:
  application:
    name: ppw-library-evaluation
  datasource:
    url: jdbc:h2:mem:libraryevaluationdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

jwt:
  secret: ${JWT_SECRET:LibraryEvaluationSecretKeyForHS256MustHaveAtLeastThirtyTwoBytes2026}
  expiration: 1200000
  refresh-expiration: 604800000
  issuer: library-evaluation-api
  header: Authorization
  prefix: "Bearer "
  